  and api.* hosts return a plain 404. No security.txt, no OpenID/OAuth metadata, no api-catalog, no ai-plugin.json,
  no agent card. No WellKnown or SecurityTxt pointer is emitted in apis.yml, because a recorded absence
  must not be scored as a presence.
