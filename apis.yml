    subdomain at all (developer/docs/developers/openapi .vipkid.com and .vipkid.com.cn
    all fail to resolve), /openapi.json and /swagger.json return 404 or 502 on all nine
    VIPKid and VIPTeacher hosts, and every /.well-known/* request on the main domains is
    302'd to Akamai's domain-control-validation host rather than answered with a document.
