aid: vipkid
name: VIPKid
description: 'VIPKid (Beijing Dami Technology Co., Ltd. / 北京大米科技有限公司) is an online
  language-education company founded in 2013 that connects children with English teachers
  over one-to-one live video lessons, and runs a global teacher-marketplace side (VIPTeacher)
  alongside consumer learning brands including Lingo Bus, VIPKID AI 双师智学, VIPKID 国际教育
  and the Dino parent-child reading rooms. The product is delivered entirely as consumer
  web and mobile apps and a teacher portal; VIPKid publishes no public developer program,
  API reference, or machine-readable contract of any kind.'
