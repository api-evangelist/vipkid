domain_standards:
  market: online language education / EdTech
  note: >-
    The education market has real interchange standards a platform of this shape could
    declare — 1EdTech LTI, OneRoster, Caliper Analytics, QTI, Ed-Fi. VIPKid declares none
    of them, and it has no contract in which such a declaration could appear. This is
    recorded as absent, not as a failure: reward-only, and a direct-to-consumer tutoring
    platform with no institutional-integration surface has no obligation to speak them.
