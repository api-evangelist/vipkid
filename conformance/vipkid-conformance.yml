provider: VIPKid
summary: >-
  VIPKid publishes no API contract, so there is no spec to test any technical
  conformance against — every API-side entry below is `conforms: false` on the grounds
  that the surface does not exist, not that it fails. What VIPKid DOES publish is a
  corporate information-security compliance claim: a dedicated 信息安全 (information
  security) page and a homepage assertion of ISO information-security management-system
  certification. That claim is recorded here with its evidence, and with the caveat that
  it is not independently machine-verifiable.
compliance:
  published: true
  page: https://www.vipkid.com.cn/inforcertification
  page_status: 200
  page_note: >-
    The page renders a single JPEG certificate scan
    (s.vipkidstatic.com/fe-static/pc/parents/img/vkindex/sanjirenzheng2018-e42246cef0.jpg)
    and carries no machine-readable text at all — no certificate number, no issuing body,
    no standard name, no validity dates in the HTML. The filename ("sanjirenzheng2018",
    三级认证 2018) indicates a 2018 China MLPS / 等级保护 Level 3 classified-protection
    certificate, but that is an inference from a file name and is NOT recorded as a
    confirmed certification.
  certifications:
  - name: ISO information security management system
    standard_family: ISO/IEC 27001 (family named only as "ISO" by the provider)
    claimed: true
    verified: false
    evidence: https://www.vipkid.com.cn/
    evidence_status: 200
    quote: 安全保护体系 保障数据安全，运营安全，通过ISO信息安全管理体系认证的在线教育企业
    note: >-
      Homepage prose claim only. No certificate number, registrar, scope statement or
      expiry is published anywhere on the site, and no trust centre exists, so the claim
      cannot be checked against a certification register.
  third_party_seals:
  - name: iTrust 可信网站认证
    url: http://www.itrust.org.cn/Home/Index/wx_certifi/wm/1805016993
    status: 000
    note: linked from the .com.cn footer; the issuing registry did not respond (timeout).
  - name: 315 诚信档案
    url: http://www.315online.com.cn/member/315150028.html
    status: 500
    note: linked from the .com.cn footer; the issuing registry returns a server error.
