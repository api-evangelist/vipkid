  registry.npmjs.org metadata endpoints, api.github.com for the VIPKID-OpenSource org,
  and trunk.cocoapods.org; PyPI, RubyGems, crates.io, NuGet, Maven Central and
  pkg.go.dev were checked and hold nothing published by VIPKid.
provider: VIPKid
summary: >-
  VIPKid publishes NO API client SDK, because it publishes no API. What it has published
  is a small set of first-party open-source front-end and mobile libraries — a
  Pixi.js-based interactive-courseware engine (VF / vf-gui) used to build its live
  classroom, an HTTPDNS client for its Android and iOS apps, and internal bridge/logging/
  upload helpers pushed to npm by individual VIPKid engineers. Every one of them is
  a client-side utility, NOT a wrapper around a VIPKid API, so no `SDKs` pointer is
  wired into apis.yml: sdk_count must not be credited for libraries that call no API.
  The whole set is also abandoned — the newest release in the table is 2021-07-17 and
  the median is 2019, and the GitHub organization that hosted the VF engine
  (github.com/vipkid-edu) now returns 404, so the npm `repository` links on the
  engine packages are dead.
sdk_count: 0
sdk_note: >-
  Zero first-party API client libraries exist. package_count below counts open-source
  utility libraries only.
